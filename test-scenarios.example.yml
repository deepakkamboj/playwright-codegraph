schemaVersion: 1
customerJourneys:
  - id: commerce
    title: Commerce
    userJourneys:
      - id: checkout
        title: Complete checkout
        actor: shopper
        scenarios:
          - id: checkout.card-payment
            title: Pay by card
            criticality: critical
            requirementRefs:
              - REQ-CHECKOUT-1
            owners:
              - commerce
            tags:
              - happy-path
              - positive
              - smoke
            codePaths:
              - apps/store/src/checkout/**
              - packages/payments/src/**
          - id: checkout.card-declined
            title: Handle a declined card
            dependsOn:
              - checkout.card-payment
            criticality: high
            requirementRefs:
              - REQ-CHECKOUT-2
            owners:
              - commerce
            tags:
              - negative
              - recovery
            codePaths:
              - packages/payments/src/**
